<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目管理系统原型</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">PM</div>
        <div>
          <p class="eyebrow">Prototype</p>
          <h1>项目管理系统</h1>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <section class="sidebar-card">
        <p class="eyebrow">本次完善</p>
        <h2>阶段推进改为由任务与里程碑推导</h2>
        <p>新增“任务与里程碑”入口，并让组织协同能挂到具体任务，形成更真实的阶段推进闭环。</p>
      </section>
    </aside>

    <main class="main">
      <header class="hero">
        <div>
          <p class="eyebrow">SOHO 项目管理系统</p>
          <h2 id="page-title">任务与里程碑</h2>
          <p id="page-description">项目阶段推进由任务、里程碑和交付物状态汇总形成。</p>
        </div>

        <div class="hero-actions">
          <button class="ghost" type="button">导出周报</button>
          <button class="primary" type="button">新建协同</button>
        </div>
      </header>

      <section class="metrics" id="metrics"></section>
      <section class="content-grid" id="content"></section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
