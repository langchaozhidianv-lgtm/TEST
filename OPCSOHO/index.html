<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目管理系统原型</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">PM</div>
        <div>
          <p class="eyebrow">Prototype</p>
          <h1>项目管理系统</h1>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <section class="sidebar-card">
        <p class="eyebrow">原型焦点</p>
        <h2>项目号贯穿全流程</h2>
        <p>把合同、成本、进度、采购、回款、风险和文档统一到同一项目视图下。</p>
      </section>
    </aside>

    <main class="main">
      <header class="hero">
        <div>
          <p class="eyebrow">晶雪项目管理系统</p>
          <h2 id="page-title">驾驶舱</h2>
          <p id="page-description">聚合项目执行、财务回款和风险状态，面向管理层快速判断项目健康度。</p>
        </div>
        <div class="hero-actions">
          <button class="ghost">导出周报</button>
          <button class="primary">新建立项</button>
        </div>
      </header>

      <section class="metrics" id="metrics"></section>
      <section class="content-grid" id="content"></section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
